openapi: 3.0.0
info:
  version: 1.0.0
  title: Car Park Service API
  description: Car Park Service API Documentation
servers:
  - url: http://localhost:3000/api/v1
paths:
  /carparks:
    get:
      summary: Get Car Parks by Criteria
      parameters:
        - name: freeParking
          in: query
          description: Free parking availability
          required: false
          schema:
            type: string
        - name: nightParking
          in: query
          description: Night parking availability
          required: false
          schema:
            type: string
        - name: gantryHeight
          in: query
          description: Minimum gantry height
          required: false
          schema:
            type: number
      responses:
        '200':
          description: A list of car parks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CarPark'
    post:
      summary: Add a new Car Park
      requestBody:
        description: A JSON object containing car park details
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CarPark'
      responses:
        '201':
          description: Car park created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CarPark'
  /carparks/{id}/favorite:
    post:
      summary: Add a car park to favorites
      parameters:
        - name: id
          in: path
          description: Car park ID
          required: true
          schema:
            type: integer
      responses:
        '201':
          description: Car park added to favorites
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Favorite'
  /favorites/{id}:
    delete:
      summary: Remove a car park from favorites
      parameters:
        - name: id
          in: path
          description: Favorite ID
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Car park removed from favorites
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Favorite'
components:
  schemas:
    CarPark:
      type: object
      properties:
        id:
          type: integer
        carParkNo:
          type: string
        address:
          type: string
        xCoord:
          type: number
        yCoord:
          type: number
        carParkType:
          type: string
        typeOfParkingSystem:
          type: string
        shortTermParking:
          type: string
        freeParking:
          type: string
        nightParking:
          type: string
        carParkDecks:
          type: integer
        gantryHeight:
          type: number
        carParkBasement:
          type: string
    Favorite:
      type: object
      properties:
        id:
          type: integer
        carParkId:
          type: integer
        userId:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        deletedAt:
          type: string
          format: date-time